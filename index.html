<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJ & Rain • Find Your Seat</title>
<meta name="description" content="Find your seat for the wedding of CJ & Rain — December 30, 2026.">
<style>
:root {
  --dusty:#8fa4ad; --dusty-dark:#667f89; --beige:#eee6d7; --paper:#fffdf9;
  --ink:#39454a; --muted:#718087; --line:#d9d2c6;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
background:linear-gradient(145deg,#f6f2eb 0%,#e9eff0 48%,#f7f2e9 100%);}
.wrap{width:min(680px,92%);margin:auto;padding:34px 0 50px}
.card{background:rgba(255,253,249,.94);border:1px solid rgba(255,255,255,.8);border-radius:28px;
box-shadow:0 18px 60px rgba(57,69,74,.14);overflow:hidden}
.hero{text-align:center;padding:38px 24px 25px}
.kicker{font-family:Arial,sans-serif;letter-spacing:3px;font-size:12px;text-transform:uppercase;color:var(--dusty-dark)}
h1{font-size:42px;font-weight:500;margin:12px 0 4px;color:#43545b}
.date{font-family:Arial,sans-serif;font-size:13px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}
.orn{margin:19px auto 3px;color:#9aabaf;font-size:20px}
.content{padding:8px 26px 30px}
label{display:block;font-family:Arial,sans-serif;font-size:13px;font-weight:700;margin:0 0 9px;color:#526168}
.searchrow{display:flex;gap:9px}
input{flex:1;min-width:0;padding:16px 17px;border:1px solid var(--line);border-radius:15px;
font-size:16px;outline:none;background:#fff;font-family:Arial,sans-serif}
input:focus{border-color:var(--dusty-dark);box-shadow:0 0 0 3px rgba(143,164,173,.18)}
button{border:0;border-radius:15px;padding:0 20px;background:var(--dusty-dark);color:white;
font-weight:700;font-family:Arial,sans-serif;font-size:15px;cursor:pointer}
button:hover{filter:brightness(.95)}
.hint{font-family:Arial,sans-serif;font-size:12px;color:var(--muted);margin:10px 2px 18px}
.result{display:none;margin-top:18px;border:1px solid var(--line);border-radius:22px;padding:23px 18px;text-align:center;background:#fff}
.result.show{display:block}
.welcome{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--dusty-dark)}
.guest{font-size:25px;margin:9px 0 16px;line-height:1.2}
.seatlabel{font-family:Arial,sans-serif;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:2px}
.seat{font-family:Arial,sans-serif;font-size:31px;font-weight:800;color:#536c75;margin-top:5px}
.note{font-family:Arial,sans-serif;color:var(--muted);font-size:12px;margin-top:15px}
.multiple{text-align:left}
.multiple p{font-family:Arial,sans-serif;font-size:13px;color:var(--muted)}
.option{width:100%;text-align:left;background:#f5f1ea;color:var(--ink);padding:14px;margin:7px 0;border:1px solid var(--line)}
.footer{text-align:center;font-family:Arial,sans-serif;font-size:11px;color:#829097;padding:5px 20px 25px}
.smallcaps{font-family:Arial,sans-serif;font-size:11px;letter-spacing:1.5px;color:var(--muted);text-align:center;margin-top:25px}
@media(max-width:480px){h1{font-size:34px}.searchrow{flex-direction:column}button{height:50px}.content{padding-left:19px;padding-right:19px}}
</style>
</head>
<body>
<div class="wrap">
 <main class="card">
  <section class="hero">
   <div class="kicker">Welcome to the wedding of</div>
   <h1>CJ &amp; Rain</h1>
   <div class="date">December 30, 2026 · Lugar De Vergara</div>
   <div class="orn">✦</div>
  </section>
  <section class="content">
   <label for="search">Find your seat</label>
   <div class="searchrow">
    <input id="search" type="search" autocomplete="off" placeholder="Enter your name…" aria-label="Search your name">
    <button id="searchBtn">Search</button>
   </div>
   <div class="hint">You may type your first name, surname, or full name.</div>
   <div id="result" class="result" aria-live="polite"></div>
   <div class="smallcaps">Thank you for celebrating with us ♡</div>
  </section>
  <div class="footer">CJ &amp; Rain · December 30, 2026</div>
 </main>
</div>

function norm(s) {
  return s.toLowerCase()
    .replace(/[’'.,-]/g,' ')
    .replace(/\b(mr|mrs|ms|maam|dss|pastor|tita)\b/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function displaySeat(g) {
  return g.seat.replace("TABLE ","TABLE ");
}
function showMatches(matches) {
  const r=document.getElementById('result');
  if(!matches.length) {
    r.className='result show';
    r.innerHTML='<div class="welcome">No match found</div><div class="guest">We could not find that name.</div><div class="note">Please try your first name or surname, or ask our wedding coordinator for assistance.</div>';
    return;
  }
  if(matches.length===1) {
    const g=matches[0];
    r.className='result show';
    r.innerHTML='<div class="welcome">Welcome!</div><div class="guest">'+escapeHtml(g.name)+'</div><div class="seatlabel">Your seat is at</div><div class="seat">'+escapeHtml(g.seat)+'</div><div class="note">Enjoy the celebration! ♡</div>';
  } else {
    r.className='result show multiple';
    r.innerHTML='<div class="welcome">We found more than one match</div><p>Please select your name:</p>'+
      matches.map((g,i)=>'<button class="option" data-i="'+i+'">'+escapeHtml(g.name)+'<br><small>'+escapeHtml(g.seat)+'</small></button>').join('');
    r.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>showMatches([matches[Number(btn.dataset.i)]])));
  }
}
function escapeHtml(s) {
 return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function search() {
 const q=norm(document.getElementById('search').value);
 if(!q) return;
 const matches=guests.filter(g=>norm(g.name).includes(q));
 showMatches(matches);
}
document.getElementById('searchBtn').addEventListener('click',search);
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
